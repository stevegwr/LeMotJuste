<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Mot Juste — entraînez votre vocabulaire</title>
<meta name="theme-color" content="#1C2554">
<script>try{var t=JSON.parse(localStorage.getItem("lemotjuste_v1")||"{}").settings||{};if(t.theme&&t.theme!=="auto")document.documentElement.dataset.theme=t.theme;}catch(e){}</script>
<meta name="description" content="Jeu pour enrichir son vocabulaire : définitions, synonymes, pendu, mots croisés, mots fléchés, racines et expressions.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/atkinson-hyperlegible-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/fraunces-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mot Juste">
<style>
@font-face{font-family:Fraunces;font-weight:400;font-display:swap;src:url(fonts/fraunces-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Fraunces;font-weight:600;font-display:swap;src:url(fonts/fraunces-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Fraunces;font-weight:800;font-display:swap;src:url(fonts/fraunces-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:700;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F5F6FB; --paper:#FFFFFF; --ink:#1C2554; --ink-soft:#4A5380; --line:#D9DCEB;
  --hl:#FFD84D; --hl-soft:#FFF1B8; --ok:#1F7A4D; --ok-bg:#E3F4EA; --ko:#B23A30; --ko-bg:#FBE7E4;
  --btn:#1C2554; --btn-text:#FFFFFF;
  --fs:1.0625rem;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121733; --paper:#1B2146; --ink:#EEF0FA; --ink-soft:#B3B9D9; --line:#2F3764;
    --hl:#E8BF2E; --hl-soft:#4A421F; --ok:#6FD39C; --ok-bg:#16392A; --ko:#FF8F84; --ko-bg:#45211E;
    --btn:#FFD84D; --btn-text:#121733;
  }
}
:root[data-theme="dark"]{
  --bg:#121733; --paper:#1B2146; --ink:#EEF0FA; --ink-soft:#B3B9D9; --line:#2F3764;
  --hl:#E8BF2E; --hl-soft:#4A421F; --ok:#6FD39C; --ok-bg:#16392A; --ko:#FF8F84; --ko-bg:#45211E;
  --btn:#FFD84D; --btn-text:#121733;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;font-size:var(--fs);line-height:1.55}
body.big{--fs:1.3rem}
.wrap{max-width:660px;margin:0 auto;padding:1.25rem 1.1rem 3rem}
h1,h2,h3,.word{font-family:Fraunces,Georgia,"Times New Roman",serif;font-weight:600;line-height:1.15;margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px}

/* En-tête */
.top{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:1.5rem}
.brand{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:1.35rem;letter-spacing:-.01em;background:none;border:0;color:var(--ink);padding:0}
.chips{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:.3rem .8rem;font-size:.9em}

/* Le surligneur : l'élément signature */
.word{font-size:clamp(2.2rem,8vw,3.4rem);font-weight:800;letter-spacing:-.02em;display:inline;
  background:linear-gradient(transparent 58%,var(--hl) 58%,var(--hl) 90%,transparent 90%);
  padding:0 .12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.word.sm{font-size:clamp(1.6rem,6vw,2.2rem)}
.swipe{background-size:0 100%;background-repeat:no-repeat;background-image:linear-gradient(transparent 58%,var(--hl) 58%,var(--hl) 90%,transparent 90%);background-color:transparent;animation:swipe .55s .15s ease-out forwards}
@keyframes swipe{to{background-size:100% 100%}}
@media (prefers-reduced-motion:reduce){.swipe{animation:none;background-size:100% 100%}}

/* Accueil */
.hero{padding:1rem 0 1.75rem}
.hero p{color:var(--ink-soft);max-width:34em;margin:.9rem 0 0}
.profiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:.75rem;margin-top:1.25rem}
.prof{text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:1rem;color:var(--ink)}
.prof:hover{border-color:var(--ink)}
.prof .ic{font-size:1.8rem;display:block;margin-bottom:.35rem}
.prof strong{font-family:Fraunces,Georgia,serif;font-size:1.2rem;display:block}
.prof span{color:var(--ink-soft);font-size:.9em}

.daily{background:var(--paper);border-left:6px solid var(--hl);border-radius:4px 14px 14px 4px;padding:1.2rem 1.25rem;margin:1.25rem 0}
.daily h2{font-size:1rem;font-family:"Atkinson Hyperlegible",sans-serif;font-weight:700;color:var(--ink-soft);margin-bottom:.5rem}
.daily .def{margin:.75rem 0 .35rem}
.daily .ex{color:var(--ink-soft);font-style:italic;margin:0}

.stats{display:flex;gap:1.5rem;flex-wrap:wrap;margin:1.25rem 0}
.stat b{font-family:Fraunces,Georgia,serif;font-size:1.6rem;display:block;line-height:1}
.stat span{color:var(--ink-soft);font-size:.88em}

.actions{display:flex;flex-direction:column;gap:.6rem;margin-top:1.5rem}
.btn{background:var(--btn);color:var(--btn-text);border:0;border-radius:12px;padding:.95rem 1.2rem;font-weight:700;font-size:1.05em}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;color:var(--ink-soft);text-decoration:underline;padding:.3rem 0}

/* Jeu */
.progress{display:flex;gap:5px;margin-bottom:1.5rem}
.progress i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.progress i.ok{background:var(--ok)} .progress i.ko{background:var(--ko)} .progress i.cur{background:var(--hl)}
.mode{color:var(--ink-soft);font-size:.92em;margin-bottom:.9rem;display:flex;justify-content:space-between;gap:1rem}
.q{margin:0 0 1.4rem}
.q .prompt{font-size:1.15em;margin:.9rem 0 0}
.q .sentence{font-family:Fraunces,Georgia,serif;font-size:1.45em;line-height:1.4;margin:.25rem 0 0}
.gap{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--ink);margin:0 .1em}
.defbox{font-family:Fraunces,Georgia,serif;font-size:1.4em;line-height:1.4;margin:.4rem 0 0}
.opts{display:grid;gap:.6rem}
.opt{text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:.85rem 1rem;color:var(--ink);font-size:1em}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ko{border-color:var(--ko);background:var(--ko-bg)}
.opt:disabled{cursor:default}

.recall{display:flex;gap:.5rem;flex-wrap:wrap}
.recall input{flex:1 1 220px;font:inherit;font-size:1.2em;padding:.8rem 1rem;border:2px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}
.recall input:focus{border-color:var(--ink);outline:none}
.pattern{font-family:Fraunces,Georgia,serif;font-size:1.5em;letter-spacing:.3em;margin:.4rem 0 1rem;word-break:break-all}
.hints{display:flex;gap:.75rem;align-items:center;margin-top:.75rem;flex-wrap:wrap}

.feedback{margin-top:1.4rem;border-radius:14px;padding:1.1rem 1.2rem;background:var(--paper);border:2px solid var(--line)}
.feedback.good{border-color:var(--ok)} .feedback.bad{border-color:var(--ko)}
.feedback .verdict{font-weight:700;margin-bottom:.4rem}
.feedback.good .verdict{color:var(--ok)} .feedback.bad .verdict{color:var(--ko)}
.feedback .ex{font-style:italic;color:var(--ink-soft);margin:.5rem 0 0}
.feedback .syn{margin:.5rem 0 0;font-size:.95em}
.feedback .btn{margin-top:1rem;width:100%}

/* Résultats & carnet */
.result-score{font-family:Fraunces,Georgia,serif;font-size:4rem;font-weight:800;line-height:1}
.levelup{background:var(--hl-soft);border-radius:12px;padding:.9rem 1.1rem;margin:1rem 0}
.list{list-style:none;padding:0;margin:1rem 0}
.list li{border-bottom:1px solid var(--line);padding:.7rem 0}
.list summary{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:1rem;list-style:none}
.list summary::-webkit-details-marker{display:none}
.list summary strong{font-family:Fraunces,Georgia,serif;font-size:1.2em}
.list .dd{color:var(--ink-soft);margin:.4rem 0 0}
.dots{display:flex;gap:3px;flex-shrink:0}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ok)}
.muted{color:var(--ink-soft)}
.filters{display:flex;gap:.5rem;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:.3rem .8rem}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* Portes d'entrée */
.doors{display:grid;gap:.7rem;margin-top:1.4rem}
.door{text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:1rem 1.15rem;color:var(--ink)}
.door:hover{border-color:var(--ink)}
.door strong{font-family:Fraunces,Georgia,serif;font-size:1.35rem;display:block;margin-bottom:.15rem}
.door span{color:var(--ink-soft);font-size:.95em}
.door.main{background:var(--btn);border-color:var(--btn);color:var(--btn-text)}
.door.main span{color:inherit;opacity:.85}
/* Pendu */
.hang-top{display:grid;grid-template-columns:110px 1fr;gap:1rem;align-items:center;margin-bottom:1.2rem}
.hang{width:110px;height:110px;stroke:var(--ink);stroke-width:4;stroke-linecap:round;fill:none;background:var(--paper);border-radius:12px;border:2px solid var(--line)}
.slots{display:flex;flex-wrap:nowrap;gap:5px;justify-content:center;margin:0 0 1.3rem;--n:8}
.slot{width:min(2.1em,calc((min(100vw,660px) - 2.6rem - (var(--n) - 1) * 5px) / var(--n)));flex-shrink:0;height:2.5em;border:0;border-bottom:3px solid var(--ink);background:transparent;color:var(--ink);font-family:Fraunces,Georgia,serif;font-weight:700;font-size:1.25em;display:inline-flex;align-items:center;justify-content:center;padding:0}
.slot.sep{border-bottom-color:transparent;width:.6em}
.slot.miss{color:var(--ko)}
.slot.lock{background:var(--hl-soft)}
.kbd{display:grid;gap:6px}
.krow{display:flex;gap:5px;justify-content:center}
.key{flex:1;max-width:44px;height:48px;border:2px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);font-weight:700;padding:0}
.key.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.key.ko{opacity:.35}
/* Anagramme */
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{width:2.6em;height:2.6em;border-radius:10px;border:0;background:var(--hl);color:#1C2554;font-family:Fraunces,Georgia,serif;font-weight:800;font-size:1.2em;box-shadow:0 3px 0 rgba(28,37,84,.35)}
.tile:disabled{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
/* Grilles */
.cluebar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:.4rem;background:var(--paper);border:2px solid var(--hl);border-radius:12px;padding:.45rem .4rem;margin-bottom:.7rem;min-height:3.4em}
.cluebar #cur{flex:1;font-size:.98em;line-height:1.35}
.nav{flex-shrink:0;width:2.2em;height:2.2em;border-radius:8px;border:0;background:var(--bg);color:var(--ink);font-size:1.2em;font-weight:700;padding:0}
.cw-wrap{overflow-x:auto;padding:2px 0 .3rem}
.cw-wrap.withtab{padding-right:24px}
.cw-wrap.withtab .cw{--cs:min(40px,calc((min(100vw,660px) - 2.6rem - 24px - (var(--cols) - 1) * 2px) / var(--cols)))}
.cw{--cs:min(40px,calc((min(100vw,660px) - 2.6rem - (var(--cols) - 1) * 2px) / var(--cols)));display:grid;grid-template-columns:repeat(var(--cols),var(--cs));gap:2px;justify-content:safe center}
.cw.fl{--cs:min(48px,calc((min(100vw,660px) - 2.6rem - (var(--cols) - 1) * 2px) / var(--cols)))}
.blk{width:var(--cs);height:var(--cs)}
.cell{position:relative;width:var(--cs);height:var(--cs);background:var(--paper);border:1.5px solid var(--ink-soft);border-radius:4px}
.cell input{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;text-align:center;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:calc(var(--cs) * .55);text-transform:uppercase;color:var(--ink);caret-color:transparent;padding:0;border-radius:3px}
.cell input:focus{outline:none}
.cell.hl{background:var(--hl-soft)} .cell.cur{background:var(--hl)} .cell.cur input{color:#1C2554}
.cell.bad input{color:var(--ko)} .cell.good{border-color:var(--ok)} .cell.given input{color:var(--ink-soft)}
.num{position:absolute;top:1px;left:2px;font-size:calc(var(--cs) * .27);line-height:1;color:var(--ink-soft);pointer-events:none;z-index:1}
.ccell{width:var(--cs);height:var(--cs);display:flex;flex-direction:column;gap:1px;background:var(--ink);border-radius:4px;overflow:hidden}
.ci{flex:1;min-height:0;border:0;background:transparent;color:var(--bg);padding:1px 2px;position:relative;display:flex;align-items:center;justify-content:center;text-align:center;font-size:max(9px,calc(var(--cs) * .23));line-height:1.05;hyphens:auto;overflow-wrap:anywhere}
.ccell.two .ci+.ci{border-top:1px solid var(--bg)}
.ci i{position:absolute;right:1px;bottom:0;font-style:normal;font-size:calc(var(--cs) * .17);color:var(--hl)}
.ci.on{background:var(--hl);color:#1C2554} .ci.on i{color:#1C2554}
.gridbar{display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap;margin-top:.7rem}
.btn.small{padding:.55rem .85rem;font-size:.92em;border-radius:10px}
/* Tiroir */
.drawer-tab{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:20;writing-mode:vertical-rl;background:var(--btn);color:var(--btn-text);border:0;border-radius:10px 0 0 10px;padding:.9rem .25rem;width:26px;font-size:.82em;font-weight:700;box-shadow:-2px 2px 8px rgba(0,0,0,.18)}
.backdrop{position:fixed;inset:0;background:rgba(10,14,35,.45);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(88vw,380px);z-index:31;background:var(--paper);color:var(--ink);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 1rem) 1rem calc(env(safe-area-inset-bottom,0px) + 1rem);transform:translateX(105%);transition:transform .25s ease;box-shadow:-6px 0 24px rgba(0,0,0,.25)}
.drawer.open{transform:none}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
.drawer h3{font-size:1.3rem} .drawer h4{margin:1rem 0 .3rem;font-family:Fraunces,Georgia,serif;font-size:1.05rem}
.drawer ol{list-style:none;margin:0;padding:0}
.clue{background:none;border:0;text-align:left;color:var(--ink);padding:.45rem .4rem;border-radius:6px;width:100%}
.clue.on{background:var(--hl-soft)}
/* Feuille de résultat */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:80vh;overflow-y:auto;padding:0 .8rem calc(env(safe-area-inset-bottom,0px) + .8rem);max-width:660px;margin:0 auto}
.sheet .feedback{box-shadow:0 -6px 24px rgba(0,0,0,.2)}
/* Fiches */
.badge{font-size:.78em;border:1px solid var(--line);border-radius:999px;padding:.1rem .55rem;white-space:nowrap;color:var(--ink-soft)}
.badge.c-a{border-color:var(--ok);color:var(--ok)}
.badge.c-d{border-color:var(--ko);color:var(--ko)}
footer{margin-top:2.5rem;color:var(--ink-soft);font-size:.85em}
/* v2 : barre « Suivant » collante, modale, toast, réglages, objectif du jour */
.stickynext{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + .6rem);z-index:4;margin-top:1rem}
.stickynext .btn{width:100%;box-shadow:0 6px 18px rgba(10,14,35,.25)}
.feedback .stickynext .btn{margin-top:0}
.kbdhint{display:none;color:var(--ink-soft);font-size:.8em;text-align:center;margin-top:.4rem}
@media (hover:hover) and (pointer:fine){.kbdhint{display:block}}
.opt .k{display:none;font-size:.78em;color:var(--ink-soft);border:1px solid var(--line);border-radius:5px;padding:0 .35em;margin-right:.6em;vertical-align:.1em}
@media (hover:hover) and (pointer:fine){.opt .k{display:inline-block}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem 1.5rem}
@media (min-width:520px){.stats{grid-template-columns:repeat(4,auto);justify-content:space-between}}
.goal{display:flex;align-items:center;gap:1rem;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:.85rem 1rem;margin:1rem 0}
.goal svg{flex-shrink:0;width:56px;height:56px;transform:rotate(-90deg)}
.goal circle{fill:none;stroke-width:7}
.goal .bg{stroke:var(--line)} .goal .fg{stroke:var(--ok);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.goal b{display:block;font-family:Fraunces,Georgia,serif;font-size:1.15rem}
.goal span{color:var(--ink-soft);font-size:.9em}
.modal-bd{position:fixed;inset:0;z-index:50;background:rgba(10,14,35,.5);display:flex;align-items:flex-end;justify-content:center;padding:1rem;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 1rem)}
@media (min-width:520px){.modal-bd{align-items:center}}
.modal{background:var(--paper);color:var(--ink);border-radius:16px;padding:1.3rem 1.2rem 1.1rem;width:min(100%,420px);box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal p{margin:0 0 1rem;font-size:1.05em}
.modal .row{display:flex;gap:.6rem}
.modal .row .btn{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 1rem);z-index:60;background:var(--ink);color:var(--bg);border-radius:12px;padding:.7rem 1rem;display:flex;gap:.9rem;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:calc(100% - 2rem)}
.toast button{background:var(--hl);color:#1C2554;border:0;border-radius:8px;padding:.35rem .7rem;font-weight:700}
.set{display:grid;gap:.2rem;margin:1rem 0}
.set h2{font-size:1.1rem;margin:1.2rem 0 .3rem}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:1rem;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:.75rem 1rem}
.setrow label{flex:1}
.setrow small{display:block;color:var(--ink-soft)}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-shrink:0}
.seg button{border:0;background:var(--paper);color:var(--ink);padding:.35rem .75rem;font-size:.9em}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.switch{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex-shrink:0;cursor:pointer;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.switch:checked{background:var(--ok)} .switch:checked::after{left:21px}
.search{width:100%;font:inherit;padding:.65rem .9rem;border:2px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);margin:.8rem 0 .6rem}
.search:focus{border-color:var(--ink);outline:none}
.near{background:var(--hl-soft);border-radius:8px;padding:.4rem .6rem;margin:.4rem 0 0;font-size:.95em}
</style>
</head>
<body>

{e:"Payer rubis sur l'ongle",s:"Payer comptant et intégralement.",o:"On vidait son verre si complètement qu'en le retournant sur l'ongle, il n'en tombait qu'une goutte, le « rubis ». L'image est passée au paiement réglé jusqu'au dernier sou.",c:"p"},
{e:"Donner sa langue au chat",s:"Renoncer à trouver la réponse.",o:"Au XVIIe siècle, on disait « jeter sa langue aux chiens ». Le chat, animal réputé mystérieux et gardien de secrets, a remplacé les chiens.",c:"p"},

{e:"Coûter les yeux de la tête",s:"Coûter extrêmement cher.",o:"Les yeux sont ce qu'on a de plus précieux : payer de ses yeux, c'est payer le prix le plus élevé qui soit.",c:"p"},

const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’']/g,"'").replace(/\s+/g," ").trim();
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

// Le bouton « retour » du téléphone ramène à l'écran parent au lieu de fermer l'appli.
// Principe : une entrée d'historique « piège » ; à chaque retour, on affiche le parent et on la remet.
let ROUTE={name:"home",parent:null,guard:null};
function at(name,parent,guard){ ROUTE={name,parent:parent||null,guard:guard||null}; if(parent) armTrap(); }
function armTrap(){ try{ if(!history.state||!history.state.lmj) history.pushState({lmj:1},""); }catch(e){} }
async function leave(target){
  // target : fonction écran à afficher ; on demande confirmation si une partie est en cours
  if(ROUTE.guard){ const msg=ROUTE.guard(); if(msg && !(await ask(msg,"Quitter","Continuer"))) return false; }
  target(); return true;
}
window.addEventListener("popstate",async ()=>{
  if(document.querySelector(".modal-bd")){ closeModal(false); history.pushState({lmj:1},""); return; }
  const drawer=document.querySelector(".drawer.open"); if(drawer){ drawer.dispatchEvent(new CustomEvent("close")); history.pushState({lmj:1},""); return; }
  if(!ROUTE.parent){ toast("Appuyez encore sur retour pour quitter.",null,null,2000); return; }   // accueil : le prochain retour ferme l'appli
  history.pushState({lmj:1},"");
  await leave(ROUTE.parent);
});
let modalResolve=null;
function ask(msg,okLabel="OK",cancelLabel="Annuler"){
  closeModal(false);
  return new Promise(res=>{
    modalResolve=res;
    const bd=document.createElement("div"); bd.className="modal-bd";
    bd.innerHTML=`<div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="mtxt"><p id="mtxt">${esc(msg)}</p><div class="row"><button class="btn ghost" data-r="0">${esc(cancelLabel)}</button><button class="btn" data-r="1">${esc(okLabel)}</button></div></div>`;
    bd.addEventListener("click",ev=>{ if(ev.target===bd) closeModal(false); const b=ev.target.closest("[data-r]"); if(b) closeModal(b.dataset.r==="1"); });
    bd.addEventListener("keydown",ev=>{ if(ev.key==="Escape"){ ev.stopPropagation(); closeModal(false);} });
    document.body.appendChild(bd); bd.querySelector('[data-r="1"]').focus();
  });
}
function closeModal(v){ const bd=document.querySelector(".modal-bd"); if(bd) bd.remove(); if(modalResolve){ const r=modalResolve; modalResolve=null; r(v); } }
let toastTimer=null;
function toast(msg,action,fn,ms=4000){
  document.querySelector(".toast")?.remove(); clearTimeout(toastTimer);
  const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status");
  t.innerHTML=`<span>${esc(msg)}</span>${action?`<button>${esc(action)}</button>`:""}`;
  if(action) t.querySelector("button").onclick=()=>{ t.remove(); fn(); };
  document.body.appendChild(t); if(ms) toastTimer=setTimeout(()=>t.remove(),ms);
}

function unlockedLevel(){
  let L=1;
  for(const l of [1,2]){
    const words=bank().filter(e=>e.l===l);
    const ok=words.filter(e=>(ws(e.w)?.box||0)>=2).length;
    if(ok/words.length>=0.6) L=l+1; else break;
  }
  return L;
}
function related(a,b){
  if(a.w===b.w) return true;
  const sa=a.s.map(norm), sb=b.s.map(norm), aa=a.a.map(norm), ab=b.a.map(norm);
  if(sa.includes(norm(b.w))||sb.includes(norm(a.w))||aa.includes(norm(b.w))||ab.includes(norm(a.w))) return true;
  return sa.some(x=>sb.includes(x));
}
function distractors(entry,n){
  const pool=bank().filter(e=>!related(entry,e));
  const same=shuffle(pool.filter(e=>e.l===entry.l)), other=shuffle(pool.filter(e=>e.l!==entry.l));
  return [...same,...other].slice(0,n);
}

function touchStreak(){
  const t=today(), last=S.streak.last;
  if(last===t) return;
  S.streak.count = (last && dayNum(t)-dayNum(last)===1) ? S.streak.count+1 : 1;
  S.streak.last=t;
}
function credit(n){
  const t=today(); if(!S.daily||S.daily.date!==t) S.daily={date:t,n:0};
  const before=S.daily.n; S.daily.n+=n; touchStreak(); save();
  const g=settings().goal; if(before<g && S.daily.n>=g){ toast("🎯 Objectif du jour atteint ! Bravo."); buzz([30,60,30]); }
}
function dailyCount(){ return S.daily&&S.daily.date===today()?S.daily.n:0; }
function streakShown(){
  const last=S.streak.last; if(!last) return 0;
  return dayNum(today())-dayNum(last)<=1 ? S.streak.count : 0;
}

/* ============ CONSTRUCTION D'UNE PARTIE ============ */
function buildSession(custom){
  const pd=pdata(), L=unlockedLevel(), now=dayNum(today());
  let list;
  if(custom){ list=shuffle(custom).slice(0,SESSION_LEN); }
  else {
    let pool=bank().filter(e=>e.l<=L);
    // Banque trop petite pour une partie complète : on emprunte au niveau suivant
    if(pool.length<SESSION_LEN) pool=bank().filter(e=>e.l<=L+1);
    const dueW=shuffle(pool.filter(e=>pd.words[e.w] && pd.words[e.w].due<=now)).sort((a,b)=>pd.words[a.w].box-pd.words[b.w].box).slice(0,6);
    const fresh=shuffle(pool.filter(e=>!pd.words[e.w])).sort((a,b)=>a.l-b.l);
    list=[...dueW, ...fresh.slice(0,SESSION_LEN-dueW.length)];
    if(list.length<SESSION_LEN){
      const rest=shuffle(pool.filter(e=>!list.includes(e))).sort((a,b)=>(pd.words[a.w]?.box||0)-(pd.words[b.w]?.box||0));
      list=[...list,...rest.slice(0,SESSION_LEN-list.length)];
    }
  }
  let prev=null;
  return shuffle(list).map(e=>{
    const box=pd.words[e.w]?.box||0;
    let modes = box<2 ? ["def","trou","syn"] : ["recall","recall","def","trou","syn","intrus","anto"];
    modes=modes.filter(m=>(m!=="syn"||e.s.length) && (m!=="intrus"||e.s.length>=3) && (m!=="anto"||e.a.length));
    const alt=modes.filter(m=>m!==prev); const m=pick(alt.length?alt:modes); prev=m;
    return {e,m};
  });
}

let G=null;
function startSession(custom){
  setKeys(null);
  G={qs:buildSession(custom),i:0,res:[],pts:0,startL:unlockedLevel(),answered:false,custom};
  question();
}
const sessionGuard=()=>G&&G.i<G.qs.length&&(G.i>0||G.answered)?"Quitter la partie en cours ? Les réponses déjà données sont enregistrées.":null;

/* ============ QUESTIONS ============ */
function progressBar(){
  return `<div class="progress" aria-label="Question ${G.i+1} sur ${G.qs.length}">${G.qs.map((_,k)=>`<i class="${k<G.i?(G.res[k]?"ok":"ko"):(k===G.i?"cur":"")}"></i>`).join("")}</div>`;
}
// Distance d'édition (fautes de frappe) : une lettre en trop, en moins, changée ou deux lettres inversées
function editDist(a,b){
  if(Math.abs(a.length-b.length)>2) return 9;
  const d=[...Array(a.length+1)].map((_,i)=>[i,...Array(b.length).fill(0)]);
  for(let j=1;j<=b.length;j++) d[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);
  }
  return d[a.length][b.length];
}
function question(){
  G.answered=false; delete G.tries;
  at("session",home,sessionGuard);
  const {e,m}=G.qs[G.i];
  let html=progressBar()+`<div class="mode"><span>${MODE_NAMES[m]}</span><span>${G.i+1} / ${G.qs.length}</span></div>`;
  let opts=null;

  if(m==="def"){
    const ds=distractors(e,3);
    html+=`<div class="q"><div class="word">${esc(e.w)}</div><p class="prompt">Que signifie ce mot ?</p></div>`;
    opts=shuffle([{t:e.d,ok:true},...ds.map(x=>({t:x.d,ok:false}))]);
  } else if(m==="trou"){
    const ds=distractors(e,3);
    const parts=e.ex.split("___");
    html+=`<div class="q"><p class="sentence">${esc(parts[0])}<span class="gap"></span>${esc(parts[1]||"")}</p><p class="prompt">Quel mot complète la phrase ?</p></div>`;
    opts=shuffle([{t:e.w,ok:true},...ds.map(x=>({t:x.w,ok:false}))]);
  } else if(m==="syn"){
    const ds=distractors(e,3);
    html+=`<div class="q"><div class="word">${esc(e.w)}</div><p class="prompt">Lequel de ces mots en est un synonyme ?</p></div>`;
    opts=shuffle([{t:pick(e.s),ok:true},...ds.map(x=>({t:pick([x.w,...x.s]),ok:false}))]);
  } else if(m==="anto"){
    const ds=distractors(e,2);
    html+=`<div class="q"><div class="word">${esc(e.w)}</div><p class="prompt">Lequel de ces mots veut dire le contraire ?</p></div>`;
    opts=shuffle([{t:pick(e.a),ok:true},{t:pick(e.s),ok:false},...ds.map(x=>({t:x.w,ok:false}))]);
  } else if(m==="intrus"){
    const d=distractors(e,1)[0];
    html+=`<div class="q"><div class="word">${esc(e.w)}</div><p class="prompt">Un de ces mots n'est <strong>pas</strong> un synonyme. Lequel ?</p></div>`;
    opts=shuffle([...shuffle(e.s).slice(0,3).map(s=>({t:s,ok:false})),{t:d.w,ok:true}]);
  } else if(m==="recall"){
    G.hints=0;
    html+=`<div class="q"><p class="prompt" style="margin-top:0">Quel mot correspond à cette définition ?</p><p class="defbox">${esc(e.d)}</p></div>
      <div class="pattern" id="pattern" aria-label="${e.w.length} lettres">${patternOf(e.w,0)}</div>
      <form class="recall" id="rf" autocomplete="off"><input id="ri" aria-label="Votre réponse" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Tapez le mot…"><button class="btn" type="submit">Valider</button></form>
      <div class="hints"><button class="link" id="hint">Afficher un indice (−3 points)</button><button class="link" id="giveup">Je ne sais pas</button></div>`;
  }

  if(opts){
    html+=`<div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k" aria-hidden="true">${k+1}</span>${esc(o.t)}</button>`).join("")}</div>
      <p class="kbdhint">Astuce : touches 1 à ${opts.length} pour répondre, Entrée pour continuer.</p>`;
  }
  html+=`<div id="fb"></div>
    <div class="actions" style="margin-top:2rem"><button class="link" id="quitS">Quitter la partie</button></div>`;
  app.innerHTML=html;
  window.scrollTo({top:0});
  $("#quitS").onclick=()=>leave(home);

  if(opts){
    const choose=k=>{
      if(G.answered) return;
      const o=opts[k], btns=app.querySelectorAll(".opt");
      btns.forEach((x,j)=>{ x.disabled=true; if(opts[j].ok) x.classList.add("ok"); });
      if(!o.ok) btns[k].classList.add("ko");
      answer(o.ok, o.ok?5:0);
    };
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(+b.dataset.k));
    setKeys(ev=>{
      if(ev.ctrlKey||ev.metaKey||ev.altKey||document.querySelector(".modal-bd")) return;
      const n=parseInt(ev.key,10);
      if(!G.answered && n>=1 && n<=opts.length){ ev.preventDefault(); choose(n-1); }
    });
  } else {
    const inp=$("#ri"); inp.focus({preventScroll:true});
    $("#rf").onsubmit=ev=>{ ev.preventDefault(); if(G.answered||!inp.value.trim()) return;
      const a=norm(inp.value), w=norm(e.w);
      let ok=a===w, near=false;
      if(!ok && w.length>=6 && editDist(a,w)===1){ ok=true; near=true; }
      if(!ok && G.tries===undefined){ G.tries=1; inp.value=""; inp.placeholder="Pas tout à fait… encore un essai"; buzz(40);
        inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake"); inp.focus(); return; }
      delete G.tries; inp.disabled=true;
      answer(ok, ok?Math.max(10-3*G.hints-(near?2:0),2):0, true, near?inp.value.trim():null);
    };
    $("#hint").onclick=()=>{ if(G.answered) return; G.hints=Math.min(G.hints+1,2); $("#pattern").innerHTML=patternOf(e.w,G.hints); if(G.hints>=2) $("#hint").disabled=true; inp.focus(); };
    $("#giveup").onclick=()=>{ if(G.answered) return; delete G.tries; inp.disabled=true; answer(false,0,true); };
  }
}
function patternOf(w,h){
  // 0 : que des tirets ; 1 : première lettre ; 2 : une lettre sur deux
  return [...w].map((c,k)=>{
    if(c===" "||c==="-"||c==="'") return c===" "?"&nbsp;":c;
    if(h>=1&&k===0) return esc(c);
    if(h>=2&&k%2===0) return esc(c);
    return "_";
  }).join("");
}

/* ============ RÉPONSE & RÉPÉTITION ESPACÉE ============ */
function answer(ok,pts,recall,typed){
  G.answered=true;
  const {e}=G.qs[G.i], pd=pdata(), now=dayNum(today());
  const st=pd.words[e.w]||{box:0,ok:0,ko:0,due:now};
  if(ok){ st.box=Math.min(st.box+1,5); st.ok++; } else { st.box=1; st.ko++; }
  st.due=now+INTERVALS[st.box];
  pd.words[e.w]=st; pd.xp+=pts; G.pts+=pts; G.res[G.i]=ok;
  save(); if(ok) credit(1);
  buzz(ok?15:[40,40,40]);
  const praise=["Exactement.","Bien vu.","Parfait.","C'est ça.","Très juste."];
  const last=G.i+1>=G.qs.length;
  const fb=$("#fb");
  fb.innerHTML=`<div class="feedback ${ok?"good":"bad"}" role="status">
    <div class="verdict">${ok?(typed?"Presque parfait !":pick(praise))+(pts?` +${pts} points`:""):"Ce n'était pas ça."}</div>
    ${typed?`<p class="near">Vous avez écrit « ${esc(typed)} » : attention à l'orthographe.</p>`:""}
    <div><strong style="font-family:Fraunces,Georgia,serif;font-size:1.3em">${esc(cap(e.w))}</strong> : ${esc(e.d)}</div>
    <p class="ex">${esc(e.ex.replace("___",e.w))}</p>
    ${e.s.length?`<p class="syn">Synonymes : ${e.s.map(esc).join(", ")}${e.a.length?`<br>Contraires : ${e.a.map(esc).join(", ")}`:""}</p>`:""}
    <div class="stickynext"><button class="btn" id="next">${last?"Voir mon résultat":"Question suivante"}</button></div>
  </div>`;
  if(recall) $("#pattern").textContent=e.w;
  const nb=$("#next");
  let timer=null;
  const go=()=>{ clearTimeout(timer); if(!G||!G.answered) return; G.i++; G.i<G.qs.length?question():results(); };
  nb.onclick=go;
  nb.focus({preventScroll:true});
  fb.scrollIntoView({behavior:reduced()?"auto":"smooth",block:"nearest"});
  setKeys(ev=>{ if(document.querySelector(".modal-bd")) return; if(ev.key==="Enter"&&document.activeElement!==nb){ ev.preventDefault(); go(); } });
  if(ok && settings().auto && !typed && !last){
    nb.textContent="Question suivante…";
    timer=setTimeout(go,1400);
    // Toucher n'importe où annule l'enchaînement automatique pour laisser le temps de lire
    const stop=ev=>{ if(ev.target===nb) return; clearTimeout(timer); nb.textContent="Question suivante"; };
    fb.addEventListener("pointerdown",stop,{once:true});
  }
}

// Mise à jour « douce » pour les jeux bonus : un échec fait reculer d'une boîte au lieu de repartir à zéro
function bump(e,ok,pts,soft){
  const pd=pdata(), now=dayNum(today());
  const st=pd.words[e.w]||{box:0,ok:0,ko:0,due:now};
  if(ok){ st.box=Math.min(st.box+1,5); st.ok++; } else { st.box=soft?Math.max(1,st.box-1):1; st.ko++; }
  st.due=now+INTERVALS[st.box];
  pd.words[e.w]=st; pd.xp+=pts; save();
  if(ok) credit(1);
}
let lastBonus=null;
function bonusWord(filter){
  const pd=pdata(), L=unlockedLevel();
  const pool=bank().filter(e=>e.l<=L && filter(e) && e.w!==lastBonus);
  const seen=pool.filter(e=>pd.words[e.w]);
  const e=pick(seen.length>=5 && Math.random()<0.75 ? seen : pool);
  lastBonus=e.w; return e;
}

/* ============ PENDU ============ */
const AZERTY=["AZERTYUIOP","QSDFGHJKLM","WXCVBN"];
const HANG_PARTS=[
 '<line x1="10" y1="112" x2="74" y2="112"/>','<line x1="30" y1="112" x2="30" y2="10"/>','<line x1="30" y1="10" x2="82" y2="10"/><line x1="30" y1="28" x2="48" y2="10"/>',
 '<line x1="82" y1="10" x2="82" y2="24"/>','<circle cx="82" cy="34" r="10"/>','<line x1="82" y1="44" x2="82" y2="76"/>',
 '<line x1="82" y1="54" x2="70" y2="66"/><line x1="82" y1="54" x2="94" y2="66"/><line x1="82" y1="76" x2="72" y2="94"/><line x1="82" y1="76" x2="92" y2="94"/>'];
function hangman(){
  const e=bonusWord(x=>norm(x.w).length>=5);
  const H={e,t:UP(e.w),used:new Set(),miss:0,max:HANG_PARTS.length,done:false};
  at("hangman",gamesHome,()=>H.used.size&&!H.done?"Abandonner ce pendu ?":null);
  screen(`
    <div class="mode"><span>Le pendu</span><span id="lives"></span></div>
    <div class="hang-top"><svg class="hang" viewBox="0 0 120 120" aria-hidden="true" id="gallows"></svg>
      <div><p class="muted" style="margin:0 0 .3rem">Définition</p><p class="defbox" style="margin:0">${esc(e.d)}</p></div></div>
    <div class="slots" id="slots" aria-live="polite" style="--n:${e.w.length}"></div>
    <div class="kbd" id="kbd">${AZERTY.map(r=>`<div class="krow">${[...r].map(l=>`<button class="key" data-l="${l}">${l}</button>`).join("")}</div>`).join("")}</div>
    <div id="fb"></div>
    <div class="actions"><button class="link" id="quit">Retour aux jeux</button></div>`);
  const draw=()=>{
    $("#gallows").innerHTML=HANG_PARTS.slice(0,H.miss).join("");
    $("#lives").textContent=`${H.max-H.miss} essai${H.max-H.miss>1?"s":""} restant${H.max-H.miss>1?"s":""}`;
    $("#slots").innerHTML=[...e.w].map((ch,i)=>{
      const u=H.t[i]; if(!/[A-Z]/.test(u)) return `<span class="slot sep">${esc(ch)}</span>`;
      const show=H.used.has(u)||H.done; return `<span class="slot ${show&&!H.used.has(u)?"miss":""}">${show?esc(ch.toUpperCase()):""}</span>`;
    }).join("");
  };
  const play=l=>{
    if(H.done||H.used.has(l)) return;
    H.used.add(l);
    const k=$(`.key[data-l="${l}"]`); k.disabled=true;
    if(H.t.includes(l)) k.classList.add("ok"); else { k.classList.add("ko"); H.miss++; buzz(30); }
    const won=[...H.t].every(c=>!/[A-Z]/.test(c)||H.used.has(c));
    if(won||H.miss>=H.max){ H.done=true; setKeys(null); document.querySelectorAll(".key").forEach(b=>b.disabled=true);
      bump(e,won,won?6:0,true);
      draw(); endBox(won,e,won?`Trouvé ! +6 points`:"Perdu, voici le mot.",hangman); return; }
    draw();
  };
  document.querySelectorAll(".key").forEach(b=>b.onclick=()=>play(b.dataset.l));
  setKeys(ev=>{ const l=UP(ev.key); if(/^[A-Z]$/.test(l)&&!ev.ctrlKey&&!ev.metaKey) play(l); });
  $("#quit").onclick=gamesHome;
  draw();
}

/* ============ ANAGRAMME ============ */
function anagram(){
  const e=bonusWord(x=>{const n=norm(x.w);return n.length>=5&&n.length<=12&&/^[a-z]+$/.test(n);});
  const t=UP(e.w);
  let letters; do{ letters=shuffle([...t]); }while(letters.join("")===t);
  const A={e,t,tiles:letters.map((l,i)=>({l,i,used:false})),ans:[],hints:0,done:false};
  at("anagram",gamesHome);
  screen(`
    <div class="mode"><span>L'anagramme</span><span>${t.length} lettres</span></div>
    <p class="defbox" style="margin:0 0 1.2rem">${esc(e.d)}</p>
    <div class="slots" id="ans" style="--n:${t.length}"></div>
    <div class="tiles" id="tiles"></div>
    <div class="hints"><button class="link" id="clr">Effacer</button><button class="link" id="hint">Placer une lettre (−2 points)</button><button class="link" id="give">Je donne ma langue au chat</button></div>
    <div id="msg" class="muted" aria-live="polite" style="min-height:1.6em;margin-top:.5rem"></div>
    <div id="fb"></div>
    <div class="actions"><button class="link" id="quit">Retour aux jeux</button></div>`);
  const draw=()=>{
    $("#ans").innerHTML=[...t].map((_,k)=>{const a=A.ans[k];return `<button class="slot ${a&&a.lock?"lock":""}" data-k="${k}" ${!a||a.lock||A.done?"disabled":""}>${a?a.l:""}</button>`;}).join("");
    $("#tiles").innerHTML=A.tiles.map((x,k)=>`<button class="tile" data-k="${k}" ${x.used||A.done?"disabled":""}>${x.used?"":x.l}</button>`).join("");
    document.querySelectorAll("#tiles .tile").forEach(b=>b.onclick=()=>take(+b.dataset.k));
    document.querySelectorAll("#ans .slot").forEach(b=>b.onclick=()=>drop(+b.dataset.k));
  };
  const take=k=>{ if(A.done) return; const x=A.tiles[k]; if(x.used||A.ans.length>=t.length) return; x.used=true; A.ans.push({l:x.l,k}); draw(); check(); };
  const drop=k=>{ const a=A.ans[k]; if(!a||a.lock) return; A.ans.splice(k,1); A.tiles[a.k].used=false; draw(); $("#msg").textContent=""; };
  const clear=()=>{ A.ans=A.ans.filter(a=>{ if(a.lock) return true; A.tiles[a.k].used=false; return false; }); draw(); $("#msg").textContent=""; };
  const check=()=>{
    if(A.ans.length<t.length) return;
    if(A.ans.map(a=>a.l).join("")===t) finish(true);
    else { $("#msg").textContent="Pas encore : touchez une lettre placée pour la retirer."; $("#ans").classList.remove("shake"); void $("#ans").offsetWidth; $("#ans").classList.add("shake"); }
  };
  const finish=ok=>{ A.done=true; setKeys(null);
    if(!ok){ A.ans=[...t].map(l=>({l,lock:true})); }
    draw(); const pts=ok?Math.max(6-2*A.hints,1):0; bump(e,ok,pts,true);
    endBox(ok,e,ok?`Bravo ! +${pts} points`:"Voici le mot.",anagram); };
  $("#clr").onclick=clear;
  $("#hint").onclick=()=>{ if(A.done) return;
    clear(); const n=A.ans.length; if(n>=t.length-1) return;
    const k=A.tiles.findIndex(x=>!x.used&&x.l===t[n]); A.tiles[k].used=true; A.ans.push({l:t[n],k,lock:true}); A.hints++; draw(); check(); };
  $("#give").onclick=()=>{ if(!A.done) finish(false); };
  $("#quit").onclick=gamesHome;
  setKeys(ev=>{ if(A.done) return;
    if(ev.key==="Backspace"){ const last=A.ans.length-1; if(last>=0) drop(last); ev.preventDefault(); return; }
    const l=UP(ev.key); if(!/^[A-Z]$/.test(l)) return; const k=A.tiles.findIndex(x=>!x.used&&x.l===l); if(k>=0) take(k); });
  draw();
}

/* ============ GRILLES : MOTS CROISÉS & MOTS FLÉCHÉS ============ */
// Indice court pour les mots fléchés : le synonyme le plus court, en un seul mot si possible
function shortClue(e){
  const c=e.s.filter(s=>!s.includes(" ")&&s.length<=12&&!norm(e.w).startsWith(norm(s).slice(0,4)));
  if(!c.length) return null;
  return c.sort((a,b)=>a.length-b.length)[0];
}
function genGrid(fleche){
  const L=unlockedLevel();
  const ok=e=>{const n=norm(e.w);return /^[a-z]+$/.test(n)&&n.length>=4&&n.length<=(fleche?8:9)&&(!fleche||shortClue(e));};
  let pool=bank().filter(e=>e.l<=L&&ok(e));
  if(pool.length<16) pool=bank().filter(ok);
  const MAXSPAN=fleche?9:10, TARGET=fleche?6:7; let best=null;
  for(let t=0;t<120;t++){
    const words=shuffle(pool); const grid=new Map(); const placed=[];
    const G=(r,c)=>grid.get(r+","+c);

const crossword=()=>gridGame(false);

function gridGame(fleche){

  const order=X.words.map((w,wi)=>wi).sort((a,b)=>X.words[a].d-X.words[b].d||X.words[a].n-X.words[b].n);
  let grid=`<div class="cw ${fleche?"fl":""}" style="--cols:${X.C}">`;
  for(let r=0;r<X.R;r++) for(let c=0;c<X.C;c++){ const k=r+","+c, cl=X.cells.get(k);

      grid+=`<div class="ccell ${both?"two":""}">${[0,1].filter(d=>cc[d]!==null).map(d=>`<button class="ci" data-wi="${cc[d]}" aria-label="Indice ${d?"vertical":"horizontal"} : ${esc(X.words[cc[d]].clue)}"><span>${esc(X.words[cc[d]].clue)}</span><i aria-hidden="true">${d?"▼":"▶"}</i></button>`).join("")}</div>`; continue; }
    if(!cl){ grid+=`<div class="blk"></div>`; continue; }
    const n=fleche?0:X.starts.indexOf(k)+1;
    grid+=`<div class="cell" data-k="${k}">${n?`<span class="num">${n}</span>`:""}<input aria-label="Case ligne ${r+1}, colonne ${c+1}" maxlength="2" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false"></div>`; }
  grid+=`</div>`;
  const clueList=d=>order.filter(wi=>X.words[wi].d===d).map(wi=>{const w=X.words[wi];return `<li><button class="clue" data-wi="${wi}"><b>${w.n}.</b> ${esc(w.e.d)} <span class="muted">(${w.s.length})</span></button></li>`;}).join("");
  screen(`
    <div class="mode"><span>${fleche?"Mots fléchés":"Mots croisés"}</span><span>${X.words.length} mots</span></div>
    <div class="cluebar"><button class="nav" id="prev" aria-label="Mot précédent">‹</button><div id="cur" aria-live="polite">Touchez une case${fleche?" ou un indice":""} pour commencer.</div><button class="nav" id="nextw" aria-label="Mot suivant">›</button></div>
    <div class="cw-wrap ${fleche?"":"withtab"}">${grid}</div>
    <div class="gridbar"><button class="btn small" id="check">Vérifier</button><button class="btn ghost small" id="reveal">Révéler la case</button><button class="btn ghost small" id="sol">Solution</button></div>
    <div id="msg" class="muted" aria-live="polite" style="min-height:1.5em;margin-top:.4rem;text-align:center"></div>
    ${fleche?"":`<button class="drawer-tab" id="dtab" aria-controls="drawer" aria-expanded="false">Définitions</button>
    <div class="backdrop" id="bd" hidden></div>
    <aside class="drawer" id="drawer" aria-label="Définitions" aria-hidden="true">
      <div class="drawer-head"><h3>Définitions</h3><button class="nav" id="dclose" aria-label="Fermer">✕</button></div>
      <h4>Horizontalement</h4><ol>${clueList(0)}</ol><h4>Verticalement</h4><ol>${clueList(1)}</ol></aside>`}
    <div id="fb"></div>
    <div class="actions" style="margin-top:.6rem"><button class="link" id="quit">Retour aux jeux</button></div>`);
  const inp=k=>document.querySelector(`.cell[data-k="${k}"] input`);
  const wordCells=wi=>{const w=X.words[wi];return [...w.s].map((_,i)=>(w.r+(w.d?i:0))+","+(w.c+(w.d?0:i)));};
  const curWord=()=>{const cl=X.cells.get(X.active);return cl?(cl.w[X.dir]||cl.w[1-X.dir]):null;};

      const db=$("#def"); if(db) db.onclick=()=>{ X.showDef=true; renderBar(); inp(X.active).focus(); }; }

  const stepFrom=(k,delta)=>{ const cl=X.cells.get(k), ref=cl.w[X.dir]; if(!ref) return null; return wordCells(ref.wi)[ref.i+delta]||null; };

    const k=el.parentNode.dataset.k;
    el.addEventListener("pointerdown",()=>{ X.tapToggle=(X.active===k&&document.activeElement===el); });

    el.addEventListener("click",()=>{ const cl=X.cells.get(k); if(X.tapToggle&&cl.w[0]&&cl.w[1]){ X.dir=1-X.dir; highlight(); } X.tapToggle=false; });
    el.addEventListener("input",()=>{ if(X.done) return; const v=UP(el.value).replace(/[^A-Z]/g,""); el.value=v.slice(-1); el.parentNode.classList.remove("bad","good");

    const cw=curWord(); let pos=cw?order.indexOf(cw.wi):-1;
    for(let n=0;n<order.length;n++){ pos=(pos+delta+order.length)%order.length; const wi=order[pos];

  };
  $("#prev").onclick=()=>nextWord(-1); $("#nextw").onclick=()=>nextWord(1);

  if(drawer){ $("#dtab").onclick=()=>setDrawer(true); $("#bd").onclick=()=>setDrawer(false); $("#dclose").onclick=()=>setDrawer(false);
    drawer.addEventListener("keydown",ev=>{ if(ev.key==="Escape") setDrawer(false); }); }
  document.querySelectorAll(".clue,.ci").forEach(b=>b.onclick=()=>{ setDrawer(false); if(!X.done) goWord(+b.dataset.wi); });
  $("#check").onclick=()=>{ if(X.done) return; let bad=0, empty=0;
    for(const [k,cl] of X.cells){ const el=inp(k), cell=el.parentNode; cell.classList.remove("bad","good");
      if(!el.value) empty++; else if(el.value!==cl.ch){ bad++; cell.classList.add("bad"); } else cell.classList.add("good"); }
    if(!bad&&!empty) win();
    else $("#msg").textContent=[bad?`${bad} case${bad>1?"s":""} à corriger`:"",empty?`${empty} case${empty>1?"s":""} vide${empty>1?"s":""}`:""].filter(Boolean).join(", ")+".";
  };

    const good=Q.res.filter(Boolean).length; touchStreak(); save(); renderChips(); at("quizEnd",back);
    screen(`<section class="hero"><div class="result-score">${good}<span style="font-size:.4em;color:var(--ink-soft)"> / ${Q.qs.length}</span></div>
      <p style="font-size:1.15em">${esc(title)} terminé.</p></section>
      <div class="actions"><button class="btn" id="again">Refaire un quiz</button><button class="btn ghost" id="back">Revoir les fiches</button></div>`);
    $("#again").onclick=()=>runQuiz(factory,back,title); $("#back").onclick=back;
  };
  show();
}

$("#homeBtn").onclick=()=>leave(home);
$("#footSet").onclick=()=>leave(settingsScreen);
applySettings();
home();

// Hors ligne + mises à jour : quand une nouvelle version est installée, on propose de recharger
if("serviceWorker" in navigator && location.protocol!=="file:"){
  const hadController=!!navigator.serviceWorker.controller;
  let reloading=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(!hadController||reloading) return;
    toast("Une nouvelle version du jeu est prête.","Recharger",()=>{ reloading=true; location.reload(); },0);
  });
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
</script>
